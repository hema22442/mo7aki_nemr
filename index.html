<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الاختبار</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary-color: #008080; --bg-color: #f0f4f7; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--primary-color); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background-color: #e9ecef; border-left: 2px solid #ddd; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .timer-box { background: white; padding: 15px; text-align: center; border: 1px solid #ccc; font-size: 24px; font-weight: bold; border-radius: 5px; }
        .questions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .q-num { width: 40px; height: 40px; background: white; border: 1px solid #ccc; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; border-radius: 4px; }
        .q-num.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .q-num.answered { background-color: #555; color: white; }
        .content { flex: 1; padding: 40px; background: white; margin: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-y: auto; }
        .question-text { font-size: 20px; margin-bottom: 30px; font-weight: bold; color: #333; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 15px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; }
        .option:hover { background-color: #f9f9f9; }
        .option.selected { border-color: var(--primary-color); background-color: #e0f2f2; }
        .option-prefix { font-weight: bold; margin-left: 10px; color: var(--primary-color); }
        .footer-controls { margin-top: 40px; display: flex; justify-content: space-between; padding-top: 20px; border-top: 1px solid #eee; }
        button { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-next { background-color: var(--primary-color); color: white; }
        .btn-prev { background-color: #ccc; }
        footer { background-color: var(--primary-color); color: white; text-align: center; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div>مجموع الأسئلة: 15</div>
    <div id="timer-display">الوقت المتبقي: <span id="timer-top">15:00</span></div>
</header>

<div class="main-container">
    <div class="sidebar" id="sidebar">
        <div class="timer-box" id="timer-box">15:00</div>
        <div class="questions-grid" id="q-grid"></div>
    </div>
    <div class="content" id="main-content">
        <div id="quiz-ui">
            <div class="question-text" id="q-text">جاري التحميل...</div>
            <div class="options" id="options-container"></div>
            <div class="footer-controls">
                <button class="btn-prev" onclick="prevQuestion()">السابق</button>
                <button class="btn-next" onclick="nextQuestion()">حفظ والتالي</button>
            </div>
        </div>
    </div>
</div>

<footer>محاكي الاختبار</footer>

<script>
    // --- إعداداتك التي أرسلتها ---
    const PUBLIC_KEY = "cQYqz70Te8w8308k-"; 
    const SERVICE_ID = "service_alszjvq"; 
    const TEMPLATE_ID = "template_8o5hc72"; 

    emailjs.init(PUBLIC_KEY);

    const prefixes = ["أ", "ب", "ج", "د"];
    
    // مصفوفة الأسئلة بناءً على ما أرسلت
    const questions = [
        { q: "زفير : شهيق", options: ["غطس : طفو", "طرق : سيارة", "قراءة : كتابة", "حليب : لبن"], correct: 0 },
        { q: "رف : دولاب", options: ["جبهة : رأس", "رمش : حاجب", "كتاب : مطبعة", "كهرباء : مولد"], correct: 0 },
        { q: "جمر : رماد", options: ["إنسان : موت", "شمس : غروب", "شيخ : طفل", "عجين : خبز"], correct: 0 },
        { q: "نواة : خلية", options: ["ذهب : ميزان", "درج : خزانه", "جذر : تربة", "حقيبة : قلم"], correct: 1 },
        { q: "إن خروج الإنسان من دائرة ........ الضيقة في إيثار نفسه إلى دائرة أعم وأشمل في محبة الآخرين لهو ........ خلقي كريم", options: ["اهتماماته - انحياز", "أنانيته - ارتقاء", "محيطه - تواضع", "مجتمعه - نمط"], correct: 1 },
        { q: "يحدث المد والجزر بسبب قرب القمر من الأرض وبسبب ذلك تزداد جاذبية .... سرعته رغم صغر حجمه.", options: ["أقرب", "سرعته", "رغم", "صغر"], correct: 1 },
        { q: "اشتغال ( انشغال ) ……….. بنفسه وتقويمها ، خير من تقويم ………", options: ["المفكر - الفكرة", "المعلم - الطلاب", "المدير - المدرسة", "المرء - الأخرين"], correct: 3 },
        { q: "مصارع ....... في .......", options: ["القوم _ أهوائهم", "الناس _ أرزاقهم", "العقلاء _ آرائهم", "الجهلاء _ سفهاءهم"], correct: 0 },
        { q: "اصبر على من عاداك من ذوي النصيحة والتجرع لمرارة قولهم. (الكلمة الخطأ سياقياً)", options: ["التجرع", "اصبر", "عاداك", "لمرارة"], correct: 2 },
        { q: "استبسل الجنود في المعركة فبذلك فاز الأعداء بيسر وسهولة. (الكلمة الخطأ سياقياً)", options: ["استبسل", "المعركة", "بيسر", "سهولة"], correct: 0 },
        { q: "الرجل العظيم يقوم بالتروي في أقواله والسرعة في كلامه. (الكلمة الخطأ سياقياً)", options: ["العظيم", "التروي", "أقواله", "كلامه"], correct: 3 },
        { q: "يلقى الشاعر كلمته العصماء فتحرك النفوس وتطرب الأسماع. (الكلمة الخطأ سياقياً)", options: ["كلمته", "العصماء", "النفوس", "تطرب"], correct: 0 },
        { q: "رئة : تنفس", options: ["معدة : هضم", "عين : سهر", "لسان : ذوق", "أذن : سماعة"], correct: 0 },
        { q: "خيط : ثوب", options: ["خرز : مسبحة", "باب : جدار", "غصن : شجرة", "ورقة : كتاب"], correct: 0 },
        { q: "قدم : جسم", options: ["عجلة : سيارة", "غصن : شجرة", "محراب : مسجد", "نافذة : غرفة"], correct: 0 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 900;

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            div.innerHTML = `<span class='option-prefix'>${prefixes[i]}-</span> ${opt}`;
            div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); };
            container.appendChild(div);
        });
        updateGrid();
    }

    function updateGrid() {
        const grid = document.getElementById('q-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = `q-num ${i === currentIdx ? 'active' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; renderQuestion(); };
            grid.appendChild(d);
        });
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('main-content').innerHTML = "<h3 style='text-align:center;'>جاري إرسال إجاباتك... يرجى الانتظار</h3>";
        let correctCount = 0;
        let details = "";
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) correctCount++;
            details += `س${i+1}: اختار (${prefixes[userAnswers[i]] || 'لم يحل'}) | الصح (${prefixes[q.correct]}) - ${isCorrect ? '✅' : '❌'}\n`;
        });
        const score = Math.round((correctCount / 15) * 100);
        emailjs.send(SERVICE_ID, TEMPLATE_ID, { user_score: score + "%", user_details: details })
            .then(() => {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('main-content').innerHTML = `
                    <div style="text-align:center; padding-top: 50px;">
                        <h1 style="color: var(--primary-color);">تم تسليم الإجابات بنجاح</h1>
                        <p>شكراً لك على إتمام الاختبار. سيتم مراجعة أدائك من قبل المشرف.</p>
                    </div>`;
            });
    }

    function nextQuestion() {
        if (currentIdx < 14) { currentIdx++; renderQuestion(); }
        else { if(confirm("هل تريد تسليم الاختبار؟")) finishQuiz(); }
    }

    function prevQuestion() { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }

    const timerInterval = setInterval(() => {
        let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
        let str = `${m}:${s < 10 ? '0'+s : s}`;
        document.getElementById('timer-box').innerText = str;
        document.getElementById('timer-top').innerText = str;
        if(timeLeft-- <= 0) finishQuiz();
    }, 1000);

    renderQuestion();
</script>
</body></html>
