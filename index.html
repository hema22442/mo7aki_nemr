<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary-color: #008080; --bg-sidebar: #e9eff5; --white: #ffffff; --btn-prev: #eeeeee; }
        
        /* العلامة المائية - الشعار الخاص بك */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/xKfTBF1r/adfd5a1f-3530-4c63-ab3b-7dcf73cd6672.jpg');
            background-repeat: repeat;
            background-position: center;
            background-size: 160px; /* حجم الشعار في الخلفية */
            opacity: 0.05; /* درجة الشفافية خفيفة جداً حتى لا تعيق القراءة */
            z-index: -1;
            pointer-events: none;
            filter: grayscale(100%); /* تحويله لرمادي ليكون رسمياً أكثر */
        }

        body { font-family: Arial, sans-serif; background-color: #f7f9fb; margin: 0; display: flex; flex-direction: column; height: 100vh; position: relative; }
        header { background-color: var(--primary-color); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; flex-wrap: wrap; gap: 5px; z-index: 10; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background-color: var(--bg-sidebar); border-left: 1px solid #d1d9e0; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .timer-section { background: #fff; border: 1px solid #ccd6dd; border-radius: 4px; padding: 10px; text-align: center; }
        .timer-value { font-size: 22px; font-weight: bold; }
        .info-box { background: #fff; border: 1px solid #ccd6dd; border-radius: 4px; padding: 8px; text-align: center; font-size: 12px; }
        .questions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .q-num { width: 100%; height: 35px; background: white; border: 1px solid #ccd6dd; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; font-weight: bold; }
        .q-num.active { border: 2px solid orange; }
        .q-num.answered { background-color: #00a651; color: white; border: none; }
        .content { flex: 1; padding: 15px; background: rgba(255, 255, 255, 0.8); display: flex; flex-direction: column; overflow-y: auto; }
        .font-controls { display: flex; gap: 5px; margin-bottom: 15px; }
        .font-btn { background-color: #00bcd4; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; }
        .option { padding: 12px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; font-size: 15px; transition: 0.2s; background: white; }
        .option.selected { border: 2px solid var(--primary-color); background-color: #e6f2f2; }
        .footer-controls { border-top: 1px solid #eee; padding-top: 15px; display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn-prev { background-color: var(--btn-prev); color: #666; }
        footer { background-color: var(--primary-color); color: white; text-align: center; padding: 10px; font-weight: bold; }

        #name-screen { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; text-align: center; }
        #name-input { padding: 15px; width: 280px; font-size: 18px; border: 2px solid var(--primary-color); border-radius: 8px; margin-bottom: 15px; text-align: center; outline: none; }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; font-size: 12px; }
            .main-container { flex-direction: column-reverse; overflow-y: auto; }
            .sidebar { width: auto; border-left: none; border-bottom: 1px solid #ddd; height: auto; padding: 15px; }
            .questions-grid { grid-template-columns: repeat(8, 1fr); }
            .content { height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

<div id="name-screen">
    <img src="https://i.ibb.co/xKfTBF1r/adfd5a1f-3530-4c63-ab3b-7dcf73cd6672.jpg" alt="Logo" style="width: 120px; margin-bottom: 20px;">
    <h2 style="color: var(--primary-color);">مرحباً بك في محاكي اختبار النمر</h2>
    <p>يرجى إدخال اسمك الثلاثي للبدء:</p>
    <input type="text" id="name-input" placeholder="اكتب اسمك هنا...">
    <button class="btn btn-save" onclick="startQuiz()">بدء الاختبار الآن</button>
</div>

<header>
    <div>الأسئلة المرحلة : 0</div>
    <div>عنوان الاختبار : 148 . الصفدي ووصف الجندي</div>
    <div>مجموع الأسئلة : 15</div>
</header>

<div class="main-container">
    <div class="content" id="main-content">
        <div class="font-controls">
            <button class="font-btn" onclick="changeFontSize(2)">+A</button>
            <button class="font-btn" onclick="changeFontSize(0)">A</button>
            <button class="font-btn" onclick="changeFontSize(-2)">-A</button>
        </div>

        <div id="quiz-ui">
            <div class="question-area" id="q-area" style="min-height: 200px;">
                <div id="q-text" style="font-weight: bold; margin-bottom: 20px; font-size: 1.2em;">جاري تحميل السؤال...</div>
                <div id="options-container"></div>
            </div>
            
            <div class="footer-controls">
                <button class="btn btn-prev" onclick="prevQuestion()">السابق</button>
                <button class="btn btn-save" onclick="nextQuestion()">حفظ و التالي</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="timer-section">
            <div class="timer-value" id="timer-box">15:00</div>
        </div>
        <div class="info-box">
            تم الإجابة <span id="answered-count" style="color: green; font-weight: bold;">0</span> / 15
        </div>
        <div class="questions-grid" id="q-grid"></div>
    </div>
</div>

<footer>محاكي اختبار النمر</footer>

<script>
    const PUBLIC_KEY = "cQYqz70Te8w8308k-"; 
    const SERVICE_ID = "service_alszjvq"; 
    const TEMPLATE_ID = "template_8o5hc72"; 
    emailjs.init(PUBLIC_KEY);

    let userName = "";
    const prefixes = ["أ", "ب", "ج", "د"];
    const questions = [
        { q: "زفير : شهيق", options: ["غطس : طفو", "طرق : سيارة", "قراءة : كتابة", "حليب : لبن"], correct: 0 },
        { q: "رف : دولاب", options: ["جبهة : رأس", "رمش : حاجب", "كتاب : مطبعة", "كهرباء : مولد"], correct: 0 },
        { q: "جمر : رماد", options: ["إنسان : موت", "شمس : غروب", "شيخ : طفل", "عجين : خبز"], correct: 0 },
        { q: "نواة : خلية", options: ["ذهب : ميزان", "درج : خزانه", "جذر : تربة", "حقيبة : قلم"], correct: 1 },
        { q: "إن خروج الإنسان من دائرة ........ الضيقة في إيثار نفسه إلى دائرة أعم وأشمل في محبة الآخرين لهو ........ خلقي كريم", options: ["اهتماماته - انحياز", "أنانيته - ارتقاء", "محيطه - تواضع", "مجتمعه - نمط"], correct: 1 },
        { q: "يحدث المد والجزر بسبب قرب القمر من الأرض وبسبب ذلك تزداد جاذبية .... سرعته رغم صغر حجمه.", options: ["أقرب", "سرعته", "رغم", "صغر"], correct: 1 },
        { q: "اشتغال ( انشغال ) ……….. بنفسه وتقويمها ، خير من تقويم ………", options: ["المفكر - الفكرة", "المعلم - الطلاب", "المدير - المدرسة", "المرء - الأخرين"], correct: 3 },
        { q: "مصارع ....... في .......", options: ["القوم _ أهوائهم", "الناس _ أرزاقهم", "العقلاء _ آرائهم", "الجهلاء _ سفهاءهم"], correct: 0 },
        { q: "اصبر على من عاداك من ذوي النصيحة والتجرع لمرارة قولهم.", options: ["التجرع", "اصبر", "عاداك", "لمرارة"], correct: 2 },
        { q: "استبسل الجنود في المعركة فبذلك فاز الأعداء بيسر وسهولة.", options: ["استبسل", "المعركة", "بيسر", "سهولة"], correct: 0 },
        { q: "الرجل العظيم يقوم بالتروي في أقواله والسرعة في كلامه.", options: ["العظيم", "التروي", "أقواله", "كلامه"], correct: 3 },
        { q: "يلقى الشاعر كلمته العصماء فتحرك النفوس وتطرب الأسماع.", options: ["كلمته", "العصماء", "النفوس", "تطرب"], correct: 0 },
        { q: "رئة : تنفس", options: ["معدة : هضم", "عين : سهر", "لسان : ذوق", "أذن : سماعة"], correct: 0 },
        { q: "خيط : ثوب", options: ["خرز : مسبحة", "باب : جدار", "غصن : شجرة", "ورقة : كتاب"], correct: 0 },
        { q: "قدم : جسم", options: ["عجلة : سيارة", "غصن : شجرة", "محراب : مسجد", "نافذة : غرفة"], correct: 0 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timerInterval;
    let currentFontSize = 18;

    // استعادة البيانات عند تحميل الصفحة (Refresh)
    window.onload = function() {
        const savedName = localStorage.getItem('tiger_userName');
        const savedEndTime = localStorage.getItem('tiger_endTime');
        const savedAnswers = localStorage.getItem('tiger_answers');

        if (savedName && savedEndTime) {
            const now = Date.now();
            if (now < savedEndTime) {
                userName = savedName;
                userAnswers = JSON.parse(savedAnswers) || new Array(questions.length).fill(null);
                document.getElementById('name-screen').style.display = 'none';
                renderQuestion();
                updateStats();
                startTimer(savedEndTime);
            } else {
                clearStorage();
            }
        }
    };

    function startQuiz() {
        const input = document.getElementById('name-input');
        if (input.value.trim().length < 3) {
            alert("يرجى إدخال اسمك بالكامل للمتابعة.");
            return;
        }
        userName = input.value.trim();
        const endTime = Date.now() + (15 * 60 * 1000);
        
        localStorage.setItem('tiger_userName', userName);
        localStorage.setItem('tiger_endTime', endTime);
        localStorage.setItem('tiger_answers', JSON.stringify(userAnswers));

        document.getElementById('name-screen').style.display = 'none';
        renderQuestion();
        startTimer(endTime);
    }

    function startTimer(endTime) {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const now = Date.now();
            const distance = endTime - now;
            if (distance <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
                return;
            }
            let m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById('timer-box').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            div.innerHTML = `<span style='margin-left:8px; font-weight:bold;'>${prefixes[i]}.</span> ${opt}`;
            div.onclick = () => { 
                userAnswers[currentIdx] = i; 
                localStorage.setItem('tiger_answers', JSON.stringify(userAnswers));
                renderQuestion(); 
                updateStats(); 
            };
            container.appendChild(div);
        });
        updateGrid();
    }

    function updateGrid() {
        const grid = document.getElementById('q-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            let statusClass = (userAnswers[i] !== null) ? 'answered' : '';
            if (i === currentIdx) statusClass += ' active';
            d.className = `q-num ${statusClass}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; renderQuestion(); };
            grid.appendChild(d);
        });
    }

    function updateStats() {
        document.getElementById('answered-count').innerText = userAnswers.filter(a => a !== null).length;
    }

    function changeFontSize(val) {
        currentFontSize = (val === 0) ? 18 : currentFontSize + val;
        document.getElementById('q-area').style.fontSize = currentFontSize + "px";
    }

    function clearStorage() {
        localStorage.removeItem('tiger_userName');
        localStorage.removeItem('tiger_endTime');
        localStorage.removeItem('tiger_answers');
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('main-content').innerHTML = "<h3>جاري تسليم إجاباتك يا " + userName + "...</h3>";
        let correctCount = 0;
        let details = "";
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) correctCount++;
            details += `س${i+1}: (${prefixes[userAnswers[i]] || 'X'}) | الصح (${prefixes[q.correct]}) | ${isCorrect ? '✔' : '✘'}\n`;
        });
        
        const emailParams = {
            user_name: userName,
            user_score: Math.round((correctCount/15)*100) + "%",
            user_details: details
        };

        emailjs.send(SERVICE_ID, TEMPLATE_ID, emailParams)
            .then(() => {
                clearStorage();
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('main-content').innerHTML = `
                    <div style='text-align:center; padding-top:50px;'>
                        <img src="https://i.ibb.co/xKfTBF1r/adfd5a1f-3530-4c63-ab3b-7dcf73cd6672.jpg" style="width:100px;">
                        <h1 style='color:var(--primary-color)'>تم التسليم بنجاح</h1>
                        <p>شكراً لك يا <b>${userName}</b>، تم إرسال نتيجتك للمشرف.</p>
                    </div>`;
            });
    }

    function nextQuestion() {
        if (currentIdx < 14) { currentIdx++; renderQuestion(); }
        else { if(confirm("هل تريد تسليم الاختبار النهائي؟")) finishQuiz(); }
    }

    function prevQuestion() { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }
</script>
</body></html>
