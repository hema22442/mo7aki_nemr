<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { 
            --primary-color: #008080; 
            --bg-sidebar: #e9eff5;
            --white: #ffffff;
            --btn-prev: #eeeeee;
        }

        body { font-family: Arial, sans-serif; background-color: #f7f9fb; margin: 0; display: flex; flex-direction: column; height: 100vh; }

        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 13px;
            flex-wrap: wrap; /* للسماح بالنزول لسطر جديد في الموبايل */
            gap: 5px;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar { 
            width: 220px; 
            background-color: var(--bg-sidebar); 
            border-left: 1px solid #d1d9e0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            overflow-y: auto;
        }

        .timer-section { background: #fff; border: 1px solid #ccd6dd; border-radius: 4px; padding: 10px; text-align: center; }
        .timer-value { font-size: 22px; font-weight: bold; }

        .info-box { background: #fff; border: 1px solid #ccd6dd; border-radius: 4px; padding: 8px; text-align: center; font-size: 12px; }

        .questions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .q-num { 
            width: 100%; height: 35px; background: white; border: 1px solid #ccd6dd; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .q-num.active { border: 2px solid orange; }
        .q-num.answered { background-color: #00a651; color: white; border: none; }

        .content { flex: 1; padding: 15px; background: white; display: flex; flex-direction: column; overflow-y: auto; }
        
        .font-controls { display: flex; gap: 5px; margin-bottom: 15px; }
        .font-btn { background-color: #00bcd4; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; }

        .question-area { flex: 1; min-height: 200px; }
        .option { 
            padding: 12px; border: 1px solid #eee; border-radius: 8px; 
            cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; 
            font-size: 15px; transition: 0.2s;
        }
        .option.selected { border: 2px solid var(--primary-color); background-color: #e6f2f2; }

        .footer-controls { border-top: 1px solid #eee; padding-top: 15px; display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn-prev { background-color: var(--btn-prev); color: #666; }

        footer { background-color: var(--primary-color); color: white; text-align: center; padding: 10px; font-weight: bold; }

        /* تعديلات الموبايل (Media Queries) */
        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; font-size: 12px; }
            .main-container { flex-direction: column-reverse; overflow-y: auto; }
            .sidebar { width: auto; border-left: none; border-bottom: 1px solid #ddd; height: auto; padding: 15px; }
            .questions-grid { grid-template-columns: repeat(8, 1fr); } /* عرض مربعات أكثر في الصف الواحد للموبايل */
            .content { height: auto; overflow: visible; }
            .timer-section { display: inline-block; width: 45%; margin-left: 5%; }
            .info-box { display: inline-block; width: 45%; }
        }
    </style>
</head>
<body>

<header>
    <div>الأسئلة المرحلة : 0</div>
    <div>عنوان الاختبار : 148 . الصفدي ووصف الجندي</div>
    <div>مجموع الأسئلة : 15</div>
</header>

<div class="main-container">
    <div class="content" id="main-content">
        <div class="font-controls">
            <button class="font-btn" onclick="changeFontSize(2)">+A</button>
            <button class="font-btn" onclick="changeFontSize(0)">A</button>
            <button class="font-btn" onclick="changeFontSize(-2)">-A</button>
        </div>

        <div id="quiz-ui">
            <div class="question-area" id="q-area">
                <div id="q-text" style="font-weight: bold; margin-bottom: 20px;">جاري تحميل السؤال...</div>
                <div id="options-container"></div>
            </div>
            
            <div class="footer-controls">
                <button class="btn btn-prev" onclick="prevQuestion()">السابق</button>
                <button class="btn btn-save" onclick="nextQuestion()">حفظ و التالي</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="timer-section">
            <div class="timer-value" id="timer-box">15:00</div>
        </div>
        <div class="info-box">
            تم الإجابة <span id="answered-count" style="color: green; font-weight: bold;">0</span> / 15
        </div>
        <div class="questions-grid" id="q-grid"></div>
    </div>
</div>

<footer>محاكي اختبار النمر</footer>

<script>
    const PUBLIC_KEY = "cQYqz70Te8w8308k-"; 
    const SERVICE_ID = "service_alszjvq"; 
    const TEMPLATE_ID = "template_8o5hc72"; 
    emailjs.init(PUBLIC_KEY);

    const prefixes = ["أ", "ب", "ج", "د"];
    const questions = [
        { q: "زفير : شهيق", options: ["غطس : طفو", "طرق : سيارة", "قراءة : كتابة", "حليب : لبن"], correct: 0 },
        { q: "رف : دولاب", options: ["جبهة : رأس", "رمش : حاجب", "كتاب : مطبعة", "كهرباء : مولد"], correct: 0 },
        { q: "جمر : رماد", options: ["إنسان : موت", "شمس : غروب", "شيخ : طفل", "عجين : خبز"], correct: 0 },
        { q: "نواة : خلية", options: ["ذهب : ميزان", "درج : خزانه", "جذر : تربة", "حقيبة : قلم"], correct: 1 },
        { q: "إن خروج الإنسان من دائرة ........ الضيقة في إيثار نفسه إلى دائرة أعم وأشمل في محبة الآخرين لهو ........ خلقي كريم", options: ["اهتماماته - انحياز", "أنانيته - ارتقاء", "محيطه - تواضع", "مجتمعه - نمط"], correct: 1 },
        { q: "يحدث المد والجزر بسبب قرب القمر من الأرض وبسبب ذلك تزداد جاذبية .... سرعته رغم صغر حجمه.", options: ["أقرب", "سرعته", "رغم", "صغر"], correct: 1 },
        { q: "اشتغال ( انشغال ) ……….. بنفسه وتقويمها ، خير من تقويم ………", options: ["المفكر - الفكرة", "المعلم - الطلاب", "المدير - المدرسة", "المرء - الأخرين"], correct: 3 },
        { q: "مصارع ....... في .......", options: ["القوم _ أهوائهم", "الناس _ أرزاقهم", "العقلاء _ آرائهم", "الجهلاء _ سفهاءهم"], correct: 0 },
        { q: "اصبر على من عاداك من ذوي النصيحة والتجرع لمرارة قولهم.", options: ["التجرع", "اصبر", "عاداك", "لمرارة"], correct: 2 },
        { q: "استبسل الجنود في المعركة فبذلك فاز الأعداء بيسر وسهولة.", options: ["استبسل", "المعركة", "بيسر", "سهولة"], correct: 0 },
        { q: "الرجل العظيم يقوم بالتروي في أقواله والسرعة في كلامه.", options: ["العظيم", "التروي", "أقواله", "كلامه"], correct: 3 },
        { q: "يلقى الشاعر كلمته العصماء فتحرك النفوس وتطرب الأسماع.", options: ["كلمته", "العصماء", "النفوس", "تطرب"], correct: 0 },
        { q: "رئة : تنفس", options: ["معدة : هضم", "عين : سهر", "لسان : ذوق", "أذن : سماعة"], correct: 0 },
        { q: "خيط : ثوب", options: ["خرز : مسبحة", "باب : جدار", "غصن : شجرة", "ورقة : كتاب"], correct: 0 },
        { q: "قدم : جسم", options: ["عجلة : سيارة", "غصن : شجرة", "محراب : مسجد", "نافذة : غرفة"], correct: 0 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 900;
    let currentFontSize = 18;

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            div.innerHTML = `<span style='margin-left:8px; font-weight:bold;'>${prefixes[i]}.</span> ${opt}`;
            div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updateStats(); };
            container.appendChild(div);
        });
        updateGrid();
    }

    function updateGrid() {
        const grid = document.getElementById('q-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            let statusClass = (userAnswers[i] !== null) ? 'answered' : '';
            if (i === currentIdx) statusClass += ' active';
            d.className = `q-num ${statusClass}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; renderQuestion(); };
            grid.appendChild(d);
        });
    }

    function updateStats() {
        document.getElementById('answered-count').innerText = userAnswers.filter(a => a !== null).length;
    }

    function changeFontSize(val) {
        currentFontSize = (val === 0) ? 18 : currentFontSize + val;
        document.getElementById('q-area').style.fontSize = currentFontSize + "px";
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('main-content').innerHTML = "<h3>جاري تسليم إجاباتك...</h3>";
        let correctCount = 0;
        let details = "";
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) correctCount++;
            details += `س${i+1}: (${prefixes[userAnswers[i]] || 'X'}) | الصح (${prefixes[q.correct]}) | ${isCorrect ? '✔' : '✘'}\n`;
        });
        emailjs.send(SERVICE_ID, TEMPLATE_ID, { user_score: Math.round((correctCount/15)*100) + "%", user_details: details })
            .then(() => {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('main-content').innerHTML = "<div style='text-align:center;'><h1>تم التسليم</h1></div>";
            });
    }

    function nextQuestion() {
        if (currentIdx < 14) { currentIdx++; renderQuestion(); }
        else { if(confirm("هل تريد التسليم؟")) finishQuiz(); }
    }

    function prevQuestion() { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }

    const timerInterval = setInterval(() => {
        let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
        document.getElementById('timer-box').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        if(timeLeft-- <= 0) finishQuiz();
    }, 1000);

    renderQuestion();
</script>
</body></html>
