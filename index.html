<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر - المطور</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { 
            --primary-color: #008080; 
            --accent-color: #00bcd4;
            --bg-sidebar: #f0f4f8; 
            --white: #ffffff; 
            --text-dark: #333;
            --correct-green: #2ecc71;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 450px;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f7f9fb; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            color: var(--text-dark);
        }

        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 12px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10; 
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 260px; 
            background-color: var(--bg-sidebar); 
            border-left: 1px solid #d1d9e0; 
            padding: 20px 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto; 
        }
        
        .timer-section { 
            background: var(--white); 
            border: 2px solid var(--primary-color); 
            border-radius: 10px; 
            padding: 15px; 
            text-align: center; 
        }
        .timer-value { font-size: 28px; font-weight: bold; color: #e74c3c; font-family: monospace; }

        .questions-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .q-num { 
            height: 35px; 
            background: white; 
            border: 1px solid #ccd6dd; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px;
            font-size: 12px;
        }
        .q-num.active { border: 2px solid #f39c12; background: #fffdf0; color: #f39c12; }
        .q-num.answered { background-color: var(--correct-green); color: white; border: none; }
        
        .content { flex: 1; padding: 30px; background: rgba(255, 255, 255, 0.88); overflow-y: auto; }
        .question-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto;
        }

        .option { 
            padding: 15px 20px; 
            border: 1px solid #dee2e6; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            transition: 0.2s;
        }
        .option:hover { background-color: #f0fafa; }
        .option.selected { border: 2px solid var(--primary-color); background-color: #f0fafa; }

        #name-screen { 
            position: fixed; inset: 0; background: #ffffff; z-index: 2000; 
            display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        
        #name-input { 
            padding: 15px; width: 100%; max-width: 320px; font-size: 18px; 
            border: 2px solid #008080; border-radius: 10px; margin-bottom: 20px; text-align: center;
        }

        .btn { padding: 12px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: var(--primary-color); color: white; }

        footer { 
            background-color: var(--primary-color); 
            color: white; 
            text-align: center; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .sidebar { width: auto; border-top: 2px solid #ddd; }
        }
    </style>
</head>
<body>

<div id="name-screen">
    <img src="https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg" alt="Logo" style="width: 150px; height: 150px; object-fit: cover; margin-bottom: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color: var(--primary-color); margin-bottom: 10px;">نظام محاكاة اختبار النمر</h2>
    <p style="color: #666; margin-bottom: 25px;">أدخل اسمك الثلاثي لبدء الاختبار (30 سؤال)</p>
    <input type="text" id="name-input" placeholder="اكتب اسمك هنا...">
    <button class="btn btn-save" style="width: 100%; max-width: 320px;" onclick="startQuiz()">ابدأ الاختبار الآن</button>
</div>

<header>
    <div id="top-answered">الأسئلة المجابة: 0 / 30</div>
    <div style="font-weight: bold;">محاكي اختبار النمر</div>
    <div id="user-display">مرحباً بك</div>
</header>

<div class="main-container">
    <div class="content" id="main-content">
        <div class="question-card" id="quiz-ui">
            <div id="section-title" style="color: var(--primary-color); font-weight: bold; margin-bottom: 10px;"></div>
            <div class="question-area" id="q-area">
                <div id="q-text" style="font-weight: bold; margin-bottom: 25px; font-size: 1.2em; line-height: 1.6;">جاري التحميل...</div>
                <div id="options-container"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <button class="btn" style="background: #e0e0e0;" onclick="prevQuestion()">السابق</button>
                <button class="btn btn-save" onclick="nextQuestion()">حفظ والتالي</button>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="timer-section">
            <div style="font-size: 12px; color: #666;">الوقت المتبقي</div>
            <div class="timer-value" id="timer-box">30:00</div>
        </div>
        <div class="questions-grid" id="q-grid"></div>
    </div>
</div>

<footer>صلي على النبي ﷺ</footer>

<script>
    const PUBLIC_KEY = "cQYqz70Te8w8308k-"; 
    const SERVICE_ID = "service_alszjvq"; 
    const TEMPLATE_ID = "template_8o5hc72"; 
    emailjs.init(PUBLIC_KEY);

    let userName = "";
    const prefixes = ["أ", "ب", "ج", "د"];
    
    const questions = [
        // --- القسم الكمي (1 - 15) ---
        { q: "تحمل لوحات السيارات في السعودية 3 حروف و3 ارقام، فكم عدد اللوحات التي تحمل 3 حروف متشابهة و3 ارقام متشابهة وارقامها ليس جميعها متطابقة؟", options: ["2520", "28000", "27720", "27360"], correct: 3 },
        { q: "يسال اب ابنه كل يوم سؤال، اذا كانت الاجابة صحيحة ياخذ ريالين واذا كانت الاجابة خاطئة ياخذ ريال، وفي نهاية الشهر جمع الابن 47 ريال، ما نسبة الاسئلة التي جاوبها الابن اجابة صحيحة تقريبا؟", options: ["37%", "41%", "43%", "57%"], correct: 3 },
        { q: "يسال أب ابنه كل يوم سؤال، اذا كانت الاجابة صحيحة ياخذ ريالين واذا كانت الاجابة خاطئة ياخذ ريال، وفي نهاية الشهر جمع الابن 43 ريال، ما نسبة الاسئلة التي جاوبها الابن اجابة صحيحة؟", options: ["37%", "41%", "43%", "45%"], correct: 2 },
        { q: "إذا كان س³ ل < 0 ، س ل² > 0 ، أي الآتي صحيح؟", options: ["س < 0 ، ل < 0", "س > 0 ، ل < 0", "س < 0 ، ل > 0", "س > 0 ، ل > 0"], correct: 1 },
        { q: "احمد يعمل يوميا اونلاين في منزله، ولكن بعد كل 4 ايام يعمل يوما حضوريا، بعد كم يوم يتكرر نفس اليوم الذي بدأ فيه الدوام الحضوري اول مرة؟", options: ["20", "30", "35", "48"], correct: 2 },
        { q: "أوجد الحد التالي: 112، 334، 556، 778، .....", options: ["99", "9000", "9009", "9910"], correct: 3 },
        { q: "20 معلم و 20 مهندس و 18 طبيب و 17 طالب صرفوا 13200 ريال، فإذا كان: 5 معلمين صرفوا مثل 4 مهندسين، 12 مهندس صرفوا مثل 9 أطباء، 6 أطباء صرفوا مثل 8 طلاب. كم متوسط صرف كل مهندس؟", options: ["180", "175", "210", "240"], correct: 3 },
        { q: "(م، ن، ج، ل، ف) نقاط في المستوى الإحداثي، إذا كانت ل تقع شرق م وغرب ن، و ج تقع جنوب شرق ن، و م تقع جنوب شرق ف، فأي الآتي يقع في أقصى الغرب؟", options: ["ف", "ج", "ن", "ل"], correct: 0 },
        { q: "تتابع مريم متوسط درجاتها، فإذا اختبرت 3 اختبارات وإذا حصلت مريم على 1 الدرجة في الاختبار التالي سيزيد متوسطها درجتها 1، وإذا حصلت على 1 في كل اختبار من الاختبارات الثلاثة التالية فسينخفض متوسط درجاتها 1، ما هو متوسط درجات اختباراتها حاليا؟", options: ["4", "5", "6", "7"], correct: 1 },
        { q: "عدد مكون من خانتين س ص، إذا كان تقريب العدد إلى أقرب 10 يساوي 100، فأي الآتي صحيح؟", options: ["س + ص = 9", "س - ص = 0", "ص - س = 4", "ص - س = 0"], correct: 2 },
        { q: "نملة موجودة في حفرة عمقها 10 متر، كل يوم تصعد 4م وتنزلق 2م، بعد كم يوماً تخرج النملة من الحفرة؟", options: ["8", "9", "10", "11"], correct: 0 },
        { q: "ما قيمة: (1 + 2 + 3 + ..... + 51) - (2 + 4 + 6 + ..... + 30)؟", options: ["1226", "1236", "1068", "1086"], correct: 3 },
        { q: "كم عدد يمكن تكوينه من الأرقام (1 ، 2 ، 3 ، 5) بدون تكرار؟", options: ["23", "32", "54", "64"], correct: 3 },
        { q: "لاحظ رجل يجلس في قطار سرعته 50 كم/س أن قطار بضائع يسير عكس الاتجاه وقد مر كاملاً خلال 9 ثواني، فإذا كان طول القطار 280 م، ما سرعة قطار البضائع بـ (كم/س)؟", options: ["50", "52", "62", "112"], correct: 2 },
        { q: "إذا كان عدد المتقدمين لأخذ تطعيم كورونا في منطقة الأحساء 5400 شخص وأخذ التطعيم 20%، كم نسبة من يأخذ التطعيم ممن لم يأخذوا التطعيم ليكون نصف عدد المتقدمين أخذ التطعيم؟", options: ["25%", "33%", "37.5%", "50%"], correct: 2 },

        // --- القسم اللفظي (16 - 30) بناءً على تعديلاتك الأخيرة ---
        { q: "مطر:نبات", options: ["عقل:علم", "جهل فشل", "مدرسة:اجتهاد", "شهادة:نجاح"], correct: 0 },
        { q: "عبارة:معنى", options: ["طهارة:صلاة", "سفرة:طاولة", "طاعة:ثواب"], correct: 2 },
        { q: "ورق : حلي", options: ["ماء : ارتواء", "قمح : خبز", "زهر : رحيق", "عسل : نحل"], correct: 1 },
        { q: "التعليم الإلكتروني عن طريق.....من الوسائل....في هذا العصر.", options: ["الحاسب-التقليدية", "الإنترنت-التقنية", "المذياع-الحديثة", "الإنترنت-التقليدية"], correct: 1 },
        { q: "إذا أمكنك توصيل فكرتك في.....لا تجعلها في......", options: ["جملة-حروف", "كتاب-صفحات", "كلمة-صفحة", "صفحة-كتاب"], correct: 2 },
        { q: "كل شيء ........ تنساه إلا ما ........ .", options: ["أدرسته - أتقنته", "قرأته - حفظته", "سمعته - فهمته", "تعلمته - أتقنته"], correct: 2 },
        { q: "لا يتحقق الوفاء الا بالغدر،وإذا كان الغدر موجوداً فإن ثقه الناس ببعضهم عجز.", options: ["الغدر", "ببعضهم", "الوفاء", "فالثقه"], correct: 1 },
        { q: "معلم نفسه ومؤدبها أحق بالإجلال من معلم ذاته ومؤدبها.", options: ["نفسه", "أحق", "بالإستحقاق", "ذاته"], correct: 3 },
        { q: "الحقيقة بنت البحث وتفضل في يد المناظرات.", options: ["الحقيقه", "البحث", "تفضل", "يد"], correct: 3 },
        { q: "شعر/قصيدة/ديوان/قصة (حدد المفردة الشاذة)", options: ["شعر", "قصيدة", "ديوان", "قصة"], correct: 3 },
        { q: "محسن/كريم/شجاع/سخي (حدد المفردة الشاذة)", options: ["محسن", "كريم", "شجاع", "سخي"], correct: 3 },
        { q: "الذخيرة/القنبلة/البندقية/الصاروخ (حدد المفردة الشاذة)", options: ["الذخيرة", "القنبلة", "البندقية", "الصاروخ"], correct: 0 },
        { q: "ما المقصود ب ( التنزه في عقول الناس ) ؟", options: ["مرافقة البسطاء", "التحدث مع الناس", "قراءة ما يكتبونه"], correct: 2 },
        { q: "من خلال النص يفهم أن سبب الأنفة:", options: ["التكبر", "العلم الغزير", "احتقار المسألة", "الحياء"], correct: 3 },
        { q: "(إني ميت وأنهم لميتون) تعتبر:", options: ["من الفأل", "امتثال", "اقتباس", "يأس"], correct: 2 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timerInterval;

    function startQuiz() {
        const input = document.getElementById('name-input');
        if (input.value.trim().length < 3) {
            alert("يرجى إدخال الاسم الثلاثي.");
            return;
        }
        userName = input.value.trim();
        document.getElementById('user-display').innerText = userName;
        const endTime = Date.now() + (30 * 60 * 1000);
        document.getElementById('name-screen').style.display = 'none';
        renderQuestion();
        startTimer(endTime);
    }

    function startTimer(endTime) {
        timerInterval = setInterval(() => {
            const distance = endTime - Date.now();
            if (distance <= 0) { clearInterval(timerInterval); finishQuiz(); return; }
            let m = Math.floor(distance / 60000);
            let s = Math.floor((distance % 60000) / 1000);
            document.getElementById('timer-box').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('section-title').innerText = currentIdx < 15 ? "القسم الكمي" : "القسم اللفظي";
        document.getElementById('q-text').innerText = `السؤال ${currentIdx + 1}: ${q.q}`;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            div.innerHTML = `<span style="background:var(--primary-color); color:white; width:25px; height:25px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; margin-left:10px;">${prefixes[i]}</span> <span>${opt}</span>`;
            div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updateStats(); };
            container.appendChild(div);
        });
        updateGrid();
    }

    function updateGrid() {
        const grid = document.getElementById('q-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = `q-num ${(userAnswers[i] !== null) ? 'answered' : ''} ${i === currentIdx ? 'active' : ''}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; renderQuestion(); };
            grid.appendChild(d);
        });
    }

    function updateStats() {
        const count = userAnswers.filter(a => a !== null).length;
        document.getElementById('top-answered').innerText = `الأسئلة المجابة: ${count} / 30`;
    }

    function nextQuestion() {
        if (currentIdx < 29) { currentIdx++; renderQuestion(); }
        else { if(confirm("هل أنت متأكد من تسليم الاختبار؟")) finishQuiz(); }
    }

    function prevQuestion() { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('main-content').innerHTML = "<div class='question-card' style='text-align:center;'><h2>جاري معالجة نتيجتك...</h2></div>";
        
        let correctCount = 0;
        let details = "";
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) correctCount++;
            details += `س${i+1}: (${prefixes[userAnswers[i]] || 'لم يحل'}) | ${isCorrect ? '✅' : '❌'}\n`;
        });

        const scorePercent = Math.round((correctCount / 30) * 100);
        
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            user_name: userName,
            user_score: scorePercent + "%",
            user_details: details
        }).then(() => {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('main-content').innerHTML = `
                <div class='question-card' style='text-align:center;'>
                    <h2 style='color:var(--primary-color)'>تم التسليم بنجاح!</h2>
                    <p style='font-size:1.2em;'>شكراً لك يا <b>${userName}</b>، تم إرسال نتيجتك بنجاح.</p>
                    <hr style='margin:20px 0; border:0; border-top:1px solid #eee;'>
                    <div style='background:#f9f9f9; padding:20px; border-radius:10px;'>
                        <p style='font-size:1.1em;'>درجتك هي: <span style='color:var(--primary-color); font-weight:bold;'>${correctCount} من 30</span></p>
                        <p style='font-size:1.5em; font-weight:bold;'>نسبتك المئوية: %${scorePercent}</p>
                    </div>
                </div>`;
        });
    }
</script>
</body>
</html>
