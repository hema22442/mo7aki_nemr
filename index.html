<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر - المطور</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { 
            --primary-color: #008080; 
            --accent-color: #00bcd4;
            --bg-sidebar: #f0f4f8; 
            --white: #ffffff; 
            --text-dark: #333;
            --correct-green: #2ecc71;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 450px;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        body { 
            font-family: Arial;
            background: #f7f9fb;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            padding: 15px;
        }

        .timer-value {
            font-size: 28px;
            font-weight: bold;
            color: red;
            text-align: center;
        }

        .content {
            flex: 1;
            padding: 25px;
            background: rgba(255,255,255,0.9);
        }

        .question-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 800px;
            margin: auto;
        }

        .option {
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .option.selected {
            border: 2px solid var(--primary-color);
            background: #e9f7f7;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        .btn-save {
            background: var(--primary-color);
            color: white;
        }

        #name-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #name-input {
            padding: 12px;
            width: 300px;
            text-align: center;
            margin-bottom: 15px;
            border: 2px solid var(--primary-color);
        }

        /* شريط الصلاة على النبي */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #111;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="name-screen">
    <h2>محاكي اختبار النمر</h2>

    <img src="https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg"
         style="width:150px; margin-bottom:20px; border-radius:15px;">

    <input id="name-input" placeholder="اكتب اسمك">
    <button class="btn btn-save" onclick="startQuiz()">ابدأ</button>
</div>

<header>
    <div id="top-answered">0 / 15</div>
    <div>اختبار النمر</div>
    <div id="user-display">مرحباً</div>
</header>

<div class="main-container">
    <div class="content">
        <div class="question-card">
            <div id="q-text"></div>
            <div id="options"></div>

            <div style="display:flex;justify-content:space-between;margin-top:20px;">
                <button class="btn" onclick="prev()">السابق</button>
                <button class="btn btn-save" onclick="next()">التالي</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="timer-value" id="timer">15:00</div>
    </div>
</div>

<div class="bottom-bar">
    صلِ على النبي ﷺ
</div>

<script>
emailjs.init("cQYqz70Te8w8308k-");

const questions = [
    {q:"زفير : شهيق", options:["غطس","طرق","قراءة","حليب"], correct:0},
    {q:"رف : دولاب", options:["جبهة","رمش","كتاب","كهرباء"], correct:0},
    {q:"جمر : رماد", options:["إنسان","شمس","شيخ","عجين"], correct:0},
    {q:"نواة : خلية", options:["ذهب","درج","جذر","حقيبة"], correct:1},
    {q:"إن خروج الإنسان ...", options:["اهتماماته","أنانيته","محيطه","مجتمعه"], correct:1},
    {q:"المد والجزر ...", options:["أقرب","سرعته","رغم","صغر"], correct:1},
    {q:"اشتغال ...", options:["المفكر","المعلم","المدير","المرء"], correct:3},
    {q:"مصارع ...", options:["القوم","الناس","العقلاء","الجهلاء"], correct:0},
    {q:"اصبر ...", options:["التجرع","اصبر","عاداك","لمرارة"], correct:2},
    {q:"استبسل ...", options:["استبسل","المعركة","بيسر","سهولة"], correct:0},
    {q:"الرجل العظيم ...", options:["العظيم","التروي","أقواله","كلامه"], correct:3},
    {q:"كلمته العصماء ...", options:["كلمته","العصماء","النفوس","تطرب"], correct:0},
    {q:"رئة : تنفس", options:["معدة","عين","لسان","أذن"], correct:0},
    {q:"خيط : ثوب", options:["خرز","باب","غصن","ورقة"], correct:0},
    {q:"قدم : جسم", options:["عجلة","غصن","محراب","نافذة"], correct:0}
];

let i=0;
let answers=[];
let name="";

function startQuiz(){
    name=document.getElementById("name-input").value;
    document.getElementById("name-screen").style.display="none";
    document.getElementById("user-display").innerText=name;
    render();
}

function render(){
    let q=questions[i];
    document.getElementById("q-text").innerText=q.q;

    let box=document.getElementById("options");
    box.innerHTML="";

    q.options.forEach((o,idx)=>{
        let div=document.createElement("div");
        div.className="option";
        div.innerText=o;
        div.onclick=()=>{
            answers[i]=idx;
            render();
        };
        box.appendChild(div);
    });

    document.getElementById("top-answered").innerText=
    answers.filter(a=>a!=null).length+" / 15";
}

function next(){
    if(i<questions.length-1){
        i++; render();
    } else finish();
}

function prev(){
    if(i>0){ i--; render(); }
}

function finish(){

    let correct=0;

    questions.forEach((q,idx)=>{
        if(answers[idx]===q.correct) correct++;
    });

    let percent=Math.round((correct/questions.length)*100);

    document.querySelector(".main-container").innerHTML = `
        <div class="question-card" style="text-align:center">
            <h2>شكراً لك يا ${name}</h2>
            <p>تم تسليم الاختبار بنجاح</p>
            <h3>نتيجتك: ${percent}%</h3>
            <h3>عدد الإجابات الصحيحة: ${correct} من ${questions.length}</h3>
        </div>
    `;

    emailjs.send("service_alszjvq","template_8o5hc72",{
        user_name:name,
        user_score:percent + "%"
    });
}
</script>

</body>
</html>
