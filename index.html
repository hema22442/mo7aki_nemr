<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر - المطور</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { 
            --primary-color: #008080; 
            --accent-color: #00bcd4;
            --bg-sidebar: #f0f4f8; 
            --white: #ffffff; 
            --text-dark: #333;
            --correct-green: #2ecc71;
        }
        
        /* العلامة المائية المحدثة بالرابط الجديد */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/cKT1jthn/ca599475-eca2-4305-bd6e-685d46472e03.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 400px;
            opacity: 0.06; /* تم زيادة الوضوح قليلاً لتناسب الرابط الجديد */
            z-index: -1;
            pointer-events: none;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f7f9fb; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            color: var(--text-dark);
        }

        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 12px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10; 
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 260px; 
            background-color: var(--bg-sidebar); 
            border-left: 1px solid #d1d9e0; 
            padding: 20px 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto; 
        }
        
        .timer-section { 
            background: var(--white); 
            border: 2px solid var(--primary-color); 
            border-radius: 10px; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .timer-value { font-size: 28px; font-weight: bold; color: #e74c3c; font-family: monospace; }

        .info-box { 
            background: var(--white); 
            border-radius: 8px; 
            padding: 10px; 
            text-align: center; 
            font-size: 14px; 
            border: 1px solid #ddd;
        }
        
        .questions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .q-num { 
            height: 40px; 
            background: white; 
            border: 1px solid #ccd6dd; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px;
            transition: 0.3s;
        }
        .q-num.active { border: 2px solid #f39c12; background: #fffdf0; color: #f39c12; }
        .q-num.answered { background-color: var(--correct-green); color: white; border: none; }
        .q-num:hover { transform: translateY(-2px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .font-controls-box { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #ddd; }
        .font-btns-wrapper { display: flex; gap: 8px; }
        .font-btn { 
            background-color: var(--accent-color); 
            color: white; border: none; 
            padding: 8px; border-radius: 5px; 
            cursor: pointer; flex: 1; font-weight: bold;
        }

        .content { flex: 1; padding: 30px; background: rgba(255, 255, 255, 0.85); overflow-y: auto; }
        .question-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto;
        }

        .question-area { margin-bottom: 25px; }
        #q-text { color: #2c3e50; line-height: 1.5; }
        
        .option { 
            padding: 15px 20px; 
            border: 1px solid #dee2e6; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            transition: all 0.2s ease;
            background: white;
        }
        .option:hover { background-color: #f8f9fa; border-color: var(--primary-color); }
        .option.selected { 
            border: 2px solid var(--primary-color); 
            background-color: #f0fafa; 
            font-weight: bold;
        }
        .prefix {
            background: var(--primary-color);
            color: white;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-left: 15px;
            font-size: 14px;
        }
        
        .footer-controls { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn { 
            padding: 12px 30px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-prev { background: #e0e0e0; color: #555; }
        .btn-save { background-color: var(--primary-color); color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        footer { background-color: #222; color: #bbb; text-align: center; padding: 10px; font-size: 12px; }

        #name-screen { 
            position: fixed; inset: 0; background: #fff; z-index: 1000; 
            display: flex; justify-content: center; align-items: center; flex-direction: column; 
        }
        #name-input { 
            padding: 15px; width: 320px; font-size: 18px; border: 2px solid #ddd; 
            border-radius: 10px; margin-bottom: 20px; text-align: center; outline: none;
        }
        #name-input:focus { border-color: var(--primary-color); }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .sidebar { width: auto; border-left: none; border-top: 2px solid #ddd; }
            .questions-grid { grid-template-columns: repeat(5, 1fr); }
            .content { padding: 15px;
