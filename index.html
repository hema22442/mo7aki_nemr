<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي اختبار النمر المطور</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
:root {
    --primary:#008080;
    --secondary:#00bcd4;
    --bg:#f5f7fa;
    --white:#fff;
    --success:#2ecc71;
    --danger:#e74c3c;
    --warning:#f39c12;
    --dark:#2c3e50;
}

*{box-sizing:border-box;}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url('https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg') center no-repeat;
    background-size:600px;
    opacity:0.06;
    filter:grayscale(100%);
    z-index:-1;
}

body{
    margin:0;
    font-family:'Segoe UI',Tahoma;
    background:var(--bg);
    color:#333;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
}

header{
    background:var(--primary);
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.main-container{display:flex;flex:1;overflow:hidden;}
.sidebar{width:270px;background:#eef3f7;padding:20px;overflow:auto;}
.content{flex:1;padding:25px;overflow:auto;}

.question-card{
    max-width:850px;
    margin:auto;
    background:white;
    border-radius:18px;
    padding:30px;
}

.timer-box{text-align:center;border:2px solid var(--primary);padding:15px;margin-bottom:20px;}
.timer-value{font-size:32px;color:var(--danger);font-family:monospace;}

.questions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.q-num{height:45px;border:1px solid #ccc;display:flex;justify-content:center;align-items:center;cursor:pointer;}
.q-num.active{background:#fff4dd;}
.q-num.answered{background:var(--success);color:white;}

.option{border:1px solid #ddd;padding:15px;margin-bottom:12px;cursor:pointer;}
.option.selected{border:2px solid var(--primary);background:#eefcfc;}

.btn{border:none;padding:12px 25px;cursor:pointer;font-weight:bold;}
.btn-primary{background:var(--primary);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-gray{background:#ddd;}

#name-screen{
    position:fixed;inset:0;background:white;z-index:9999;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
}

#name-input{
    padding:15px;border:2px solid var(--primary);
    font-size:18px;margin:20px 0;text-align:center;
}

.result-box{text-align:center;}
.result-score{font-size:55px;color:var(--primary);font-weight:bold;}

footer{
    background:var(--primary);
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<div id="name-screen">
    <h2>محاكي اختبار النمر</h2>
    <input type="text" id="name-input" placeholder="اكتب اسمك الثلاثي">
    <button class="btn btn-primary" onclick="startQuiz()">بدء الاختبار</button>
</div>

<header>
    <div id="answered-count">الأسئلة المجابة: 0 / 3</div>
    <div>اختبار النمر</div>
    <div id="user-display">مرحباً</div>
</header>

<div class="main-container">

<div class="content" id="main-content">

<div class="question-card">

<div id="question-text"></div>

<div id="options-container"></div>

<div style="display:flex;justify-content:space-between;margin-top:30px;">
<button class="btn btn-gray" onclick="prevQuestion()">السابق</button>

<div>
<button class="btn btn-danger" onclick="finishQuiz()">إنهاء</button>
<button class="btn btn-primary" onclick="nextQuestion()">التالي</button>
</div>

</div>

</div>

</div>

<div class="sidebar">
<div class="timer-box">
<div>الوقت المتبقي</div>
<div class="timer-value" id="timer">30:00</div>
</div>

<div class="questions-grid" id="questions-grid"></div>
</div>

</div>

<footer>صلي علي النبي ﷺ</footer>

<script>

const questions = [
{q:'زفير : شهيق',options:['غطس','طرق','قراءة','حليب'],correct:0},
{q:'رف : دولاب',options:['جبهة','رمش','كتاب','كهرباء'],correct:0},
{q:'جمر : رماد',options:['إنسان','شمس','شيخ','عجين'],correct:0}
];

let currentQuestion=0;
let answers=new Array(questions.length).fill(null);
let userName="";
let timerInterval;

function startQuiz(){

const input=document.getElementById('name-input');
if(input.value.trim().length<3){
alert("اكتب اسم صحيح");
return;
}

userName=input.value.trim();
document.getElementById('user-display').innerText=userName;

let endTime=Date.now()+(30*60*1000);
startTimer(endTime);

document.getElementById('name-screen').style.display='none';

renderQuestion();
updateStats();
}

function startTimer(endTime){
clearInterval(timerInterval);

timerInterval=setInterval(()=>{
let remaining=endTime-Date.now();
if(remaining<=0){
clearInterval(timerInterval);
finishQuiz();
return;
}

let m=Math.floor(remaining/60000);
let s=Math.floor((remaining%60000)/1000);

document.getElementById('timer').innerText=
`${m}:${s<10?'0'+s:s}`;

},1000);
}

function renderQuestion(){

let q=questions[currentQuestion];

document.getElementById('question-text').innerText=
`سؤال ${currentQuestion+1}: ${q.q}`;

let container=document.getElementById('options-container');
container.innerHTML="";

q.options.forEach((opt,i)=>{
let div=document.createElement('div');
div.className="option"+(answers[currentQuestion]===i?" selected":"");

div.innerText=opt;

div.onclick=()=>{
answers[currentQuestion]=i;
renderQuestion();
updateStats();
};

container.appendChild(div);
});

updateGrid();
}

function updateGrid(){
let grid=document.getElementById('questions-grid');
grid.innerHTML="";

questions.forEach((q,i)=>{
let div=document.createElement('div');
div.className="q-num"+(answers[i]!=null?" answered":"")+(currentQuestion===i?" active":"");
div.innerText=i+1;

div.onclick=()=>{
currentQuestion=i;
renderQuestion();
};

grid.appendChild(div);
});
}

function updateStats(){
let count=answers.filter(a=>a!=null).length;
document.getElementById('answered-count').innerText=
`الأسئلة المجابة: ${count} / ${questions.length}`;
}

function nextQuestion(){
if(currentQuestion<questions.length-1){
currentQuestion++;
renderQuestion();
}else finishQuiz();
}

function prevQuestion(){
if(currentQuestion>0){
currentQuestion--;
renderQuestion();
}
}

function finishQuiz(){

clearInterval(timerInterval);

let correct=0;

questions.forEach((q,i)=>{
if(answers[i]===q.correct)correct++;
});

let percentage=Math.round((correct/questions.length)*100);

document.getElementById('main-content').innerHTML=`
<div class="question-card result-box">
<h2>نتيجتك النهائية</h2>
<div class="result-score">${percentage}%</div>
<p>شكراً لك يا ${userName}</p>
</div>`;
}

</script>

</body>
</html>
