<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي اختبار النمر المطور</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
:root {
    --primary:#008080;
    --bg:#f5f7fa;
    --danger:#e74c3c;
    --success:#2ecc71;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Tahoma;
    background:var(--bg);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url('https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg') center no-repeat;
    background-size:600px;
    opacity:0.08;
    filter:grayscale(100%);
    z-index:-1;
}

/* شاشة البداية (نفس الأصل) */
#start-screen{
    position:fixed;
    inset:0;
    background:white;
    z-index:9999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

#start-screen img{
    width:150px;
    border-radius:20px;
    margin-bottom:20px;
}

#start-screen h2{
    color:var(--primary);
}

/* فقط تكبير بسيط للبوكس */
#name{
    width:100%;
    max-width:340px;
    padding:17px;
    border-radius:12px;
    border:2px solid var(--primary);
    font-size:18px;
    margin:20px 0;
    text-align:center;
}

/* الهيدر */
header{
    background:var(--primary);
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
}

/* المحتوى */
.main{display:flex;flex:1;}
.content{flex:1;padding:20px;}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
}

.option{
    padding:12px;
    border:1px solid #ddd;
    margin:10px 0;
    cursor:pointer;
}

.option.selected{
    border:2px solid var(--primary);
    background:#eefcfc;
}

.btn{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{background:var(--primary);color:white;}
.btn-danger{background:var(--danger);color:white;}

.timer{
    font-size:26px;
    color:var(--danger);
    text-align:center;
    margin-top:10px;
}

.result{
    text-align:center;
}

.score{
    font-size:55px;
    color:var(--primary);
}

</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="start-screen">
    <img src="https://i.ibb.co/qYjkGjbD/6cc50c2f-b3ae-4567-9938-c6babc3abd37.jpg">
    <h2>محاكي اختبار النمر</h2>
    <input id="name" placeholder="اكتب اسمك الثلاثي">
    <button class="btn btn-primary" onclick="start()">بدء الاختبار</button>
</div>

<header>
<div id="count">0 / 3</div>
<div id="user">مرحباً</div>
</header>

<div class="main">
<div class="content">

<div class="card" id="quiz">

<h2 id="q"></h2>
<div id="options"></div>

<br>

<button class="btn btn-danger" onclick="confirmFinish()">إنهاء الاختبار</button>
<button class="btn btn-primary" onclick="next()">التالي</button>

<div class="timer" id="timer">30:00</div>

</div>

</div>
</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

const questions=[
{q:"زفير : شهيق",options:["غطس","طرق","قراءة","حليب"],correct:0},
{q:"رف : دولاب",options:["جبهة","رمش","كتاب","كهرباء"],correct:0},
{q:"جمر : رماد",options:["إنسان","شمس","شيخ","عجين"],correct:0}
];

let i=0;
let ans=new Array(questions.length).fill(null);
let name="";
let timer;

function start(){

name=document.getElementById("name").value;

if(name.length<3)return alert("اكتب اسم صحيح");

document.getElementById("start-screen").style.display="none";

let end=Date.now()+30*60000;

timer=setInterval(()=>{
let t=end-Date.now();
if(t<=0){finish();return;}

let m=Math.floor(t/60000);
let s=Math.floor((t%60000)/1000);

document.getElementById("timer").innerText=
m+":"+(s<10?"0"+s:s);

},1000);

render();

}

function render(){

let q=questions[i];

document.getElementById("q").innerText="س"+(i+1)+": "+q.q;

let box=document.getElementById("options");
box.innerHTML="";

q.options.forEach((o,idx)=>{

let div=document.createElement("div");

div.className="option"+(ans[i]==idx?" selected":"");

div.innerText=o;

div.onclick=()=>{ans[i]=idx;render();};

box.appendChild(div);

});

document.getElementById("count").innerText=
ans.filter(x=>x!=null).length+" / "+questions.length;

document.getElementById("user").innerText=name;

}

function next(){
if(i<questions.length-1){i++;render();}
else confirmFinish();
}

function confirmFinish(){
if(confirm("هل تريد إنهاء الاختبار؟")) finish();
}

function finish(){

clearInterval(timer);

let correct=0;

questions.forEach((q,idx)=>{
if(ans[idx]==q.correct)correct++;
});

let percent=Math.round(correct/questions.length*100);

document.getElementById("quiz").innerHTML=`
<div class="result">
<h2>جاري إرسال النتيجة...</h2>
</div>`;

emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
user_name:name,
user_score:percent+"%"
}).then(()=>{

document.getElementById("quiz").innerHTML=`
<div class="result">
<h2>شكراً لإتمام الاختبار 🎉</h2>
<div class="score">${percent}%</div>
<p>تم إرسال نتيجتك بنجاح</p>
</div>`;

}).catch(()=>{

document.getElementById("quiz").innerHTML=`
<div class="result">
<h2>شكراً لإتمام الاختبار 🎉</h2>
<div class="score">${percent}%</div>
<p>تم حفظ نتيجتك</p>
</div>`;

});

}

</script>

</body>
</html>
