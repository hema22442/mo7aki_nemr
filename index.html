<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي اختبار النمر - نسخة احترافية</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { 
            --primary-green: #27ae60; 
            --dark-gray: #2c3e50;
            --light-gray: #ecf0f1;
            --white: #ffffff; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        header { 
            background-color: var(--white); 
            color: var(--dark-gray); 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--primary-green);
            z-index: 10; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* السايد بار المحسن */
        .sidebar { 
            width: 280px; 
            background-color: var(--white); 
            border-left: 1px solid #ddd; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* تصميم العداد التنازلي */
        .timer-container {
            text-align: center;
            padding: 20px;
            background: var(--dark-gray);
            color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .timer-label { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
        .timer-value { font-size: 32px; font-weight: bold; font-family: 'Courier New', Courier, monospace; color: #f1c40f; }

        /* شبكة الأسئلة */
        .questions-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .q-num { 
            height: 40px; border-radius: 5px; background: var(--light-gray); 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; cursor: pointer; transition: 0.3s; border: 1px solid #bdc3c7;
        }
        .q-num.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }
        .q-num.answered { background: #27ae60; color: white; position: relative; }
        .q-num.answered::after { content: '✓'; position: absolute; font-size: 8px; bottom: 2px; right: 2px; }

        /* منطقة المحتوى */
        .content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .question-box { 
            width: 100%; max-width: 700px; background: white; padding: 30px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        .question-text { font-size: 22px; font-weight: bold; color: var(--dark-gray); margin-bottom: 30px; line-height: 1.6; }

        /* خيارات الإجابة */
        .option { 
            display: flex; align-items: center; padding: 15px 20px; margin-bottom: 15px; 
            border: 2px solid var(--light-gray); border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .option:hover { border-color: var(--primary-green); background: #f9f9f9; }
        .option.selected { border-color: var(--primary-green); background: #eafaf1; }
        .radio-dot { 
            width: 20px; height: 20px; border: 2px solid #bdc3c7; border-radius: 50%; 
            margin-left: 15px; position: relative; 
        }
        .option.selected .radio-dot { border-color: var(--primary-green); }
        .option.selected .radio-dot::after { 
            content: ''; position: absolute; width: 12px; height: 12px; 
            background: var(--primary-green); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        /* أزرار التحكم */
        .nav-buttons { display: flex; gap: 20px; margin-top: 30px; width: 100%; max-width: 700px; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        .btn-next { background: var(--primary-green); color: white; }
        .btn-prev { background: var(--dark-gray); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* شاشة البداية */
        #start-screen {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #name-input { padding: 15px; width: 300px; border: 2px solid var(--light-gray); border-radius: 10px; font-size: 18px; margin-bottom: 20px; outline: none; text-align: center; }
        #name-input:focus { border-color: var(--primary-green); }

    </style>
</head>
<body>

<div id="start-screen">
    <img src="https://i.ibb.co/wFJt0pqx/BCO-6180dd9d-ab1d-48e6-a41a-bf541b720868.png" width="150" alt="">
    <h1 style="color: var(--dark-gray)">اختبار قياس المحاكي</h1>
    <input type="text" id="name-input" placeholder="أدخل اسمك هنا...">
    <button class="btn btn-next" style="max-width: 300px" onclick="startQuiz()">ابدأ الآن</button>
</div>

<header>
    <div id="q-progress">السؤال 1 من 15</div>
    <div id="user-name-tag" style="font-weight: bold; color: var(--primary-green);"></div>
    <div style="font-size: 12px; color: #888;">محاكي النمر V2.0</div>
</header>

<div class="main-container">
    <div class="content">
        <div class="question-box">
            <div id="q-text" class="question-text">جاري تحميل السؤال...</div>
            <div id="options-container"></div>
        </div>
        <div class="nav-buttons">
            <button class="btn btn-prev" onclick="prevQuestion()">السؤال السابق</button>
            <button class="btn btn-next" onclick="nextQuestion()">حفظ والتالي</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="timer-container">
            <div class="timer-label">الوقت المتبقي</div>
            <div id="timer" class="timer-value">15:00</div>
        </div>

        <div style="font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px;">قائمة الأسئلة</div>
        <div id="q-grid" class="questions-grid"></div>
        
        <div style="margin-top: auto; font-size: 12px; color: #999; text-align: center;">
            يجب الإجابة على جميع الأسئلة قبل التسليم
        </div>
    </div>
</div>

<script>
    // نفس منطق البرمجة السابق مع تحسينات طفيفة للعرض
    const questions = [
        { q: "زفير : شهيق", options: ["غطس : طفو", "طرق : سيارة", "قراءة : كتابة", "حليب : لبن"], correct: 0 },
        { q: "رف : دولاب", options: ["جبهة : رأس", "رمش : حاجب", "كتاب : مطبعة", "كهرباء : مولد"], correct: 0 },
        { q: "جمر : رماد", options: ["إنسان : موت", "شمس : غروب", "شيخ : طفل", "عجين : خبز"], correct: 0 },
        { q: "نواة : خلية", options: ["ذهب : ميزان", "درج : خزانه", "جذر : تربة", "حقيبة : قلم"], correct: 1 },
        { q: "إن خروج الإنسان من دائرة ........ الضيقة في إيثار نفسه إلى دائرة أعم وأشمل في محبة الآخرين لهو ........ خلقي كريم", options: ["اهتماماته - انحياز", "أنانيته - ارتقاء", "محيطه - تواضع", "مجتمعه - نمط"], correct: 1 },
        { q: "يحدث المد والجزر بسبب قرب القمر من الأرض وبسبب ذلك تزداد جاذبية .... سرعته رغم صغر حجمه.", options: ["أقرب", "سرعته", "رغم", "صغر"], correct: 1 },
        { q: "اشتغال ( انشغال ) ……….. بنفسه وتقويمها ، خير من تقويم ………", options: ["المفكر - الفكرة", "المعلم - الطلاب", "المدير - المدرسة", "المرء - الأخرين"], correct: 3 },
        { q: "مصارع ....... في .......", options: ["القوم _ أهوائهم", "الناس _ أرزاقهم", "العقلاء _ آرائهم", "الجهلاء _ سفهاءهم"], correct: 0 },
        { q: "اصبر على من عاداك من ذوي النصيحة والتجرع لمرارة قولهم.", options: ["التجرع", "اصبر", "عاداك", "لمرارة"], correct: 2 },
        { q: "استبسل الجنود في المعركة فبذلك فاز الأعداء بيسر وسهولة.", options: ["استبسل", "المعركة", "بيسر", "سهولة"], correct: 0 },
        { q: "الرجل العظيم يقوم بالتروي في أقواله والسرعة في كلامه.", options: ["العظيم", "التروي", "أقواله", "كلامه"], correct: 3 },
        { q: "يلقى الشاعر كلمته العصماء فتحرك النفوس وتطرب الأسماع.", options: ["كلمته", "العصماء", "النفوس", "تطرب"], correct: 0 },
        { q: "رئة : تنفس", options: ["معدة : هضم", "عين : سهر", "لسان : ذوق", "أذن : سماعة"], correct: 0 },
        { q: "خيط : ثوب", options: ["خرز : مسبحة", "باب : جدار", "غصن : شجرة", "ورقة : كتاب"], correct: 0 },
        { q: "قدم : جسم", options: ["عجلة : سيارة", "غصن : شجرة", "محراب : مسجد", "نافذة : غرفة"], correct: 0 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timer;

    function startQuiz() {
        const name = document.getElementById('name-input').value;
        if(name.length < 3) return alert("ادخل اسمك");
        document.getElementById('user-name-tag').innerText = "الطالب: " + name;
        document.getElementById('start-screen').style.display = 'none';
        render();
        startTimer(15 * 60);
    }

    function startTimer(seconds) {
        let t = seconds;
        timer = setInterval(() => {
            let m = Math.floor(t / 60);
            let s = t % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if(t <= 0) { clearInterval(timer); finish(); }
            t--;
        }, 1000);
    }

    function render() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('q-progress').innerText = `السؤال ${currentIdx+1} من 15`;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            div.innerHTML = `<div class="radio-dot"></div><span>${opt}</span>`;
            div.onclick = () => { userAnswers[currentIdx] = i; render(); };
            container.appendChild(div);
        });

        const grid = document.getElementById('q-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = `q-num ${i === currentIdx ? 'active' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            d.innerText = i + 1;
            d.onclick = () => { currentIdx = i; render(); };
            grid.appendChild(d);
        });
    }

    function nextQuestion() {
        if(currentIdx < 14) { currentIdx++; render(); }
        else finish();
    }

    function prevQuestion() {
        if(currentIdx > 0) { currentIdx--; render(); }
    }

    function finish() {
        alert("تم تسليم الاختبار بنجاح!");
        location.reload();
    }
</script>
</body>
</html>
